name: Backend

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_DATABASE: datepoll_test
          MYSQL_USER: datepoll
          MYSQL_PASSWORD: datepoll
          MYSQL_ROOT_PASSWORD: datepoll_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4.11-bookworm@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the backend runtime
        run: docker build --file .github/docker/Dockerfile --tag datepoll-backend:ci .github/docker

      - name: Install locked dependencies and check their requirements
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/backend" datepoll-backend:ci sh -ec '
            composer validate --strict --no-check-all
            composer install --no-interaction --prefer-dist --no-progress
            composer check-platform-reqs
            composer audit-dependencies
          '

      - name: Run tests with SQLite
        run: docker run --rm --network host --env TEST_REDIS=1 --volume "$GITHUB_WORKSPACE:/backend" datepoll-backend:ci composer test

      - name: Run tests with MySQL
        run: |
          docker run --rm --network host \
            --env DB_CONNECTION=mysql --env DB_HOST=127.0.0.1 \
            --env DB_DATABASE=datepoll_test --env DB_USERNAME=datepoll --env DB_PASSWORD=datepoll \
            --env TEST_REDIS=1 \
            --volume "$GITHUB_WORKSPACE:/backend" \
            datepoll-backend:ci composer test

      - name: Check PHP syntax
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/backend" datepoll-backend:ci composer lint

      - name: Run static analysis
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/backend" datepoll-backend:ci composer analyse

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
